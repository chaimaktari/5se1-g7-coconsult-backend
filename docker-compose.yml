services:
  anisfetoui-5se1-devdynamos:
    image: anisfetoui/anisfetoui-5se1-devdynamos:latest
    ports:
      - "8090:8090"
    networks:
      - network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://dbmysql:3306/Coconsult?createDatabaseIfNotExist=true&userSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
    depends_on:
      - dbmysql

  dbmysql:
    image: mysql:8
    container_name: dbmysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    networks:
      - network
    volumes:
      - db:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=Coconsult
      - MYSQL_ALLOW_EMPTY_PASSWORD=true

volumes:
  db:
networks:
  network:
    driver: bridge